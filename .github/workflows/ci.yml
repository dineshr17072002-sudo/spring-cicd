- name: Run tests
    run: mvn test

    - name: Build application
      run: mvn clean package

    - name: Verify JAR
      run: ls -la target/

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: target/*.jar

    - name: Build Docker Image
      run: docker build -t springboot-cicd-demo .