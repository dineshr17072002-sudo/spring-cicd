name: Spring Boot CD

on:
  workflow_run:
    workflows: ["Spring Boot CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull ghcr.io/dineshr17072002-sudo/springboot-cicd-demo:latest

      - name: Remove Old Container
        run: |
          docker rm -f springboot-cicd-demo || true

      - name: Run New Container
        run: |
          docker run -d \
            --name springboot-cicd-demo \
            -p 8080:8080 \
            ghcr.io/dineshr17072002-sudo/springboot-cicd-demo:latest

      - name: Verify Container
        run: |
          docker ps
          sleep 10
          curl http://localhost:8080